# Deploy preview for Pull Requests
name: Firebase Hosting Preview (Next.js)

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (gunakan versi LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ./my-next-app
        run: npm install

      # 4️⃣ Build Next.js app (static export)
      - name: Build Next.js app
        working-directory: ./my-next-app
        run: npm run build

      # 5️⃣ Deploy ke Firebase Hosting preview channel
      - name: Deploy Preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOGIN_604D8 }}
          projectId: login-604d8
